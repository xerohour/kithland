  <script>
    // Before the first paint (the game's shell.ts does the same once it loads): ?screen=wide's screen shape, and the
    // console's look (shell.css): the baked pictures (#console.shell-baked, the default); ?shell=3d the live 3D, which
    // starts as the case without controls (.shell-pending) until its first frame; ?shell=css the flat CSS/SVG controls.
    (function () {
      var q = new URLSearchParams(location.search), r = document.documentElement.style;
      if (q.get('screen') === 'wide') { r.setProperty('--screen-aspect', '240 / 160'); r.setProperty('--screen-ratio', '1.5'); r.setProperty('--screen-inv', String(160 / 240)); }
      var look = q.get('shell'), c = document.getElementById('console').classList;
      if (look === 'css') c.remove('shell-baked');
      if (look === '3d') c.replace('shell-baked', 'shell-pending');
      // a home-screen app (no Safari bands): shell.css lays the console out for an opaque status bar, or for an older
      // install's translucent one (the page under it, white text)
      if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
    })();
  </script>
